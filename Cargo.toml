[workspace]
resolver = "3"
members = ["crates/db2graph-sync", "crates/db2graph-sync-cli"]
default-members = ["crates/db2graph-sync", "crates/db2graph-sync-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: redb 4.x requires 1.90. Verified by the `msrv` CI job.
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Adventa (https://www.adventa.com.au)"]
homepage = "https://www.adventa.com.au"
# repository: intentionally omitted until the owner-controlled GitHub
# location is verified. See PUBLICATION_BLOCKERS in IMPLEMENTATION_STATUS.md.
keywords = ["cdc", "graph", "neo4j", "postgresql", "graphrag"]
categories = ["database", "asynchronous"]

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
hex = "0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
tokio-util = { version = "0.7.15", default-features = false }
toml = "0.9"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
