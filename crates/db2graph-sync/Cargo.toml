[package]
name = "db2graph-sync"
description = "Embeddable one-way CDC projection engine from operational databases into graph databases and optional vector indexes for GraphRAG. An open-source project by Adventa."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "api/**", "examples/**", "tests/**", "README.md", "LICENSE", "NOTICE", "Cargo.toml"]

[lib]
name = "db2graph_sync"

[features]
# The common PostgreSQL -> Neo4j configuration. Disable default features for a
# minimal core build that carries no source/target drivers.
default = ["postgres", "neo4j"]
postgres = ["dep:tokio-postgres", "dep:postgres-protocol", "dep:tokio-postgres-rustls", "tls"]
neo4j = ["dep:neo4rs"]
vector-qdrant = ["http-client"]
vector-pinecone = ["http-client"]
embedding-http = ["http-client"]
# Management HTTP router (axum). The library never binds a port itself; the
# host or the standalone binary decides whether and where to serve it.
service = ["dep:axum", "dep:tower"]
# Internal helper features.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs"]
http-client = ["dep:reqwest", "tls"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util", "net"] }
tokio-util = { workspace = true }
toml.workspace = true
tracing.workspace = true

# Crypto (default provider, NOT FIPS-validated; see docs/security.md)
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# Durable local state
redb = "4.3"

# Optional adapters
tokio-postgres = { version = "0.7.18", optional = true, default-features = false, features = ["runtime", "with-serde_json-1"] }
postgres-protocol = { version = "0.6.12", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring"] }
rustls = { version = "0.23.31", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.2", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }
neo4rs = { version = "0.8.0", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
axum = { version = "0.8.4", optional = true, default-features = false, features = ["json", "tokio", "http1", "query"] }
tower = { version = "0.5", optional = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3.20"
tower = { version = "0.5", default-features = false, features = ["util"] }

[[example]]
name = "embedded_postgres_neo4j"
required-features = ["postgres", "neo4j"]

[[example]]
name = "host_lifecycle"
required-features = ["service"]

[[example]]
name = "qdrant_indexing"
required-features = ["vector-qdrant"]

[package.metadata.docs.rs]
features = ["postgres", "neo4j", "vector-qdrant", "vector-pinecone", "embedding-http", "service"]
rustdoc-args = ["--cfg", "docsrs"]
