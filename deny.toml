# cargo-deny policy: licenses, advisories, bans and sources.
# Run: cargo deny --all-features check

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities and unmaintained crates reported by RustSec.
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates reached only through neo4rs 0.8.0, the
# latest stable Neo4j driver. Tracked in LIMITATIONS.md ("Dependency debt");
# remove when neo4rs is upgraded. Vulnerability advisories are never ignored.
ignore = [
  { id = "RUSTSEC-2025-0012", reason = "backoff unmaintained; transitive via neo4rs 0.8.0" },
  { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via neo4rs 0.8.0 -> backoff" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via neo4rs 0.8.0" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via neo4rs 0.8.0" },
]

[licenses]
version = 2
# Every license below was observed in the dependency graph and reviewed as
# compatible with distributing db2graph-sync under Apache-2.0 (with notices).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# ring's license file combines ISC-style terms with Apache-2.0 for portions.
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A second rustls crypto provider would make implicit builders panic in
# embedded hosts (ADR 0005); keep the graph single-provider.
deny = [
  { crate = "aws-lc-rs", reason = "single TLS crypto provider (ring) policy; see ADR 0005" },
  { crate = "openssl-sys", reason = "rustls-only TLS policy" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
