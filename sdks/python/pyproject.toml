[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db2graph-sync-client"
version = "0.1.0"
description = "Service SDK (HTTP client) for the db2graph-sync management API. Does not embed the engine. An open-source project by Adventa."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Adventa" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://www.adventa.com.au"

[tool.setuptools]
packages = ["db2graph_sync_client"]
