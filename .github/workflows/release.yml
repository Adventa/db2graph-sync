# Release preparation. Triggered only by version tags pushed by maintainers,
# never by pull requests, so untrusted code never sees publication secrets.
# Publishing steps run in the protected `release` environment (required
# reviewers must be configured) and are disabled until the owner-controlled
# namespaces are verified (see IMPLEMENTATION_STATUS.md, publication blockers).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: db2graph-sync }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: db2graph-sync.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: db2graph-sync }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-05)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p db2graph-sync-cli --target ${{ matrix.target }}
      - name: Stage artifact with license files
        shell: bash
        run: |
          d=db2graph-sync-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$d"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: db2graph-sync-*.tar.gz

  sbom-and-checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-05)
        with:
          toolchain: stable
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --all-features --format json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - run: |
          find . -name '*.cdx.json' -not -path './dist/*' -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/

  provenance:
    # Build provenance attestation (GitHub artifact attestations). Requires the
    # repository to allow id-token and attestations; scoped to this job only.
    needs: sbom-and-checksums
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  publish:
    needs: provenance
    # Disabled until crates.io ownership and the GitHub organization are
    # verified. Remove `if: false` only after RELEASING.md prerequisites are met.
    if: false
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-05)
        with:
          toolchain: stable
      - run: cargo publish -p db2graph-sync --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p db2graph-sync-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
